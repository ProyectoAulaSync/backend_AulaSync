openapi: 3.0.0
info:
  title: API AulaSync
  version: 1.0.0
  description: >
    API REST de AulaSync: autenticación, perfiles, salas y mensajes con historial paginado.
    No hay rutas REST de login ni logout: esas operaciones se realizan con el SDK cliente de Firebase
    Authentication. La API recibe y valida Firebase ID tokens en rutas protegidas.
paths:
  /health:
    get:
      summary: Verifica el estado del servidor
      responses:
        '200':
          description: Servidor en línea
  /api/mensaje:
    get:
      summary: Obtiene el mensaje de prueba desde Firestore
      responses:
        '200':
          description: Mensaje obtenido exitosamente
        '500':
          description: Error del servidor
  /api/auth/register:
    post:
      tags: [Autenticación]
      summary: Registro manual (correo y contraseña)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombres, apellidos, username, avatar, email, password]
              properties:
                nombres: { type: string, minLength: 1, maxLength: 60 }
                apellidos: { type: string, minLength: 1, maxLength: 60 }
                username: { type: string, minLength: 3, maxLength: 20, pattern: '^[A-Za-z0-9_]+$' }
                avatar: { type: string, minLength: 1, maxLength: 60 }
                email: { type: string, format: email }
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: Debe incluir al menos una letra y un número.
      responses:
        '201': { description: Usuario creado, content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } } }
        '400': { description: Datos inválidos, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Correo o username ya registrado (EMAIL_TAKEN / USERNAME_TAKEN), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Error al guardar el perfil en Firestore, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { description: Error inesperado al crear la cuenta, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/auth/google:
    post:
      tags: [Autenticación]
      summary: Sincroniza el perfil inicial de quien se autentica con Google (idempotente)
      description: No inicia la sesión de Google. El cliente debe autenticarse con Firebase Authentication y enviar su Firebase ID token en el encabezado Bearer.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Perfil (profileComplete=false si falta username), content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } } }
        '401': { description: Sin token o token inválido, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: La cuenta no es de Google (NOT_GOOGLE_ACCOUNT), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Error al guardar el perfil en Firestore, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { description: Error inesperado al sincronizar el perfil, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/auth/username:
    put:
      tags: [Autenticación]
      summary: Elegir nombre de usuario (paso obligatorio tras Google)
      description: Completa el perfil Google una sola vez. No es un endpoint de login; requiere un Firebase ID token Bearer.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string, minLength: 3, maxLength: 20, pattern: '^[A-Za-z0-9_]+$' }
      responses:
        '200': { description: Perfil completo, content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } } }
        '400': { description: Username con formato inválido (VALIDATION_ERROR), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Token ausente o inválido (NO_TOKEN / INVALID_TOKEN), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Perfil no encontrado (PROFILE_NOT_FOUND), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Username ocupado o ya elegido (USERNAME_TAKEN / USERNAME_ALREADY_SET), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Error al actualizar el perfil en Firestore, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/users/username-available:
    get:
      tags: [Usuarios]
      summary: Consulta si un username está libre
      parameters:
        - { in: query, name: username, required: true, description: 3–20 caracteres; letras, números y guion bajo. Se recorta y se compara sin distinguir mayúsculas., schema: { type: string, minLength: 3, maxLength: 20, pattern: '^[A-Za-z0-9_]+$' } }
      responses:
        '200':
          description: Consulta completada; available indica si se puede reservar el username.
          content:
            application/json:
              schema:
                type: object
                required: [username, available]
                properties:
                  username: { type: string, description: Username enviado en la consulta. }
                  available: { type: boolean }
        '400': { description: Username ausente o con formato inválido (VALIDATION_ERROR), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Error al consultar Firestore, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/users/me:
    get:
      tags: [Usuarios]
      summary: Perfil del usuario autenticado
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } } }
        '401': { description: No autorizado }
        '404': { description: Perfil no creado aún }
    patch:
      tags: [Usuarios]
      summary: Editar perfil del usuario (nombre, apellido, avatar, username, email)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                nombres: { type: string, description: 'Nombres' }
                apellidos: { type: string, description: 'Apellidos' }
                avatar: { type: string, description: 'Avatar / URL' }
                username: { type: string, description: 'Nuevo nombre de usuario (3-20 chars, letras/números/_)' }
                email: { type: string, format: 'email', description: 'Nuevo correo electrónico' }
      responses:
        '200': { description: Perfil actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } } }
        '400': { description: Datos de validación inválidos, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: No autorizado, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Perfil incompleto (falta username), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [Usuarios]
      summary: Eliminar cuenta de usuario
      description: |
        Borra la cuenta del usuario de forma completa: elimina el perfil de Firestore,
        libera el username en la colección usernames, borra todos los mensajes escritos por el usuario
        incluso en salas ajenas, elimina sus membresías en otras salas y elimina las salas donde es
        anfitrión junto con sus miembros y mensajes. Si el perfil ya no existe, la operación continúa
        para permitir reintentos. Un usuario que ya no existe en Firebase Authentication se considera eliminado.
        Ejecutado solo por el dueño de la sesión (token Bearer Firebase). Devuelve 204 en éxito.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Cuenta eliminada exitosamente y datos asociados limpiados }
        '401': { description: 'No autorizado (NO_TOKEN / INVALID_TOKEN)' }
        '500': { description: 'No se pudo eliminar la cuenta de Firebase Authentication (AUTH_DELETE_FAILED)' }
        '503': { description: 'Error limpiando datos en Firestore (DB_ERROR)' }
  /api/rooms:
    post:
      tags: [Salas]
      summary: Crear una sala de estudio
      description: |
        Crea una sala con un ID generado por Firestore. El anfitrión es el UID del token Bearer
        (nunca viene en el cuerpo). El nombre se recorta (trim) antes de validarse.
        Reglas del nombre: obligatorio, 1 a 80 caracteres.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre: { type: string, minLength: 1, maxLength: 80, example: 'Cálculo II' }
      responses:
        '201': { description: Sala creada, content: { application/json: { schema: { $ref: '#/components/schemas/Room' } } } }
        '400': { description: 'Datos inválidos: nombre vacío, mayor a 80 caracteres o JSON mal formado (VALIDATION_ERROR / INVALID_JSON)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'No autorizado (NO_TOKEN / INVALID_TOKEN)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Perfil incompleto, falta elegir username (PROFILE_INCOMPLETE)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'Perfil no encontrado (PROFILE_NOT_FOUND)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'Error de base de datos (DB_ERROR)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      tags: [Salas]
      summary: Listar las salas creadas por el usuario autenticado
      description: |
        Devuelve únicamente las salas cuyo `anfitriónId` coincide con el UID del token.
        No acepta parámetros de usuario: nadie puede listar salas ajenas.
        Orden: más reciente primero (updatedAt).
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Lista de salas propias (puede estar vacía), content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Room' } } } } }
        '401': { description: 'No autorizado (NO_TOKEN / INVALID_TOKEN)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Perfil incompleto (PROFILE_INCOMPLETE)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: 'Error de base de datos (DB_ERROR)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/rooms/{roomId}:
    get:
      tags: [Salas]
      summary: Obtener una sala por ID
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: roomId, required: true, schema: { type: string } }
      responses:
        '200': { description: Sala encontrada, content: { application/json: { schema: { $ref: '#/components/schemas/Room' } } } }
        '401': { description: No autorizado }
        '403': { description: Perfil incompleto }
        '404': { description: Sala no encontrada }
        '503': { description: Error de base de datos }
    patch:
      tags: [Salas]
      summary: Editar el nombre de una sala (solo anfitrión)
      description: El anfitrión se determina comparando estrictamente el UID del token Bearer con anfitriónId. El nombre se recorta y debe contener de 1 a 80 caracteres.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: roomId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '200': { description: Sala actualizada, content: { application/json: { schema: { $ref: '#/components/schemas/Room' } } } }
        '400': { description: Nombre inválido, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Token ausente o inválido, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: No es el anfitrión o el perfil está incompleto, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Sala no encontrada, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Error de base de datos }
    delete:
      tags: [Salas]
      summary: Eliminar una sala (solo anfitrión)
      description: El anfitrión se determina por el UID del token Bearer. Elimina la sala y sus mensajes y miembros asociados.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: roomId, required: true, schema: { type: string } }
      responses:
        '204': { description: Sala eliminada }
        '401': { description: No autorizado }
        '403': { description: No es el anfitrión }
        '404': { description: Sala no encontrada }
        '503': { description: Error de base de datos }
  /api/rooms/{roomId}/join:
    post:
      tags: [Salas]
      summary: Unirse a una sala por su ID
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: roomId, required: true, schema: { type: string } }
      responses:
        '201': { description: Usuario unido a la sala }
        '401': { description: No autorizado }
        '403': { description: Perfil incompleto }
        '404': { description: Sala no encontrada }
        '503': { description: Error de base de datos }
  /api/rooms/{roomId}/members:
    get:
      tags: [Salas]
      summary: Listar miembros registrados de una sala
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: roomId, required: true, schema: { type: string } }
      responses:
        '200': { description: Miembros de la sala, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RoomMember' } } } } }
        '401': { description: No autorizado }
        '403': { description: Perfil incompleto }
        '503': { description: Error de base de datos }
  /api/rooms/{roomId}/messages:
    post:
      tags: [Mensajes]
      summary: Enviar un mensaje a una sala
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: roomId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                texto: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '201': { description: Mensaje enviado, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '400': { description: Datos inválidos }
        '401': { description: No autorizado }
        '404': { description: Sala no encontrada }
    get:
      tags: [Mensajes]
      summary: Obtener una página del historial en orden cronológico
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: roomId, required: true, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: before, description: ID de mensaje o fecha ISO 8601 para obtener mensajes anteriores, schema: { type: string } }
      responses:
        '200': { description: Historial de mensajes, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Message' } } } } }
        '401': { description: No autorizado }
        '404': { description: Sala no encontrada }
        '400': { description: Cursor de paginación inválido }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID Token
  schemas:
    UserProfile:
      type: object
      properties:
        uid: { type: string }
        email: { type: string }
        nombres: { type: string }
        apellidos: { type: string }
        username: { type: string, nullable: true }
        avatar: { type: string, nullable: true }
        provider: { type: string, enum: [password, google] }
        profileComplete: { type: boolean }
    Room:
      type: object
      properties:
        id: { type: string }
        nombre: { type: string }
        anfitriónId: { type: string }
        createdAt:
          type: object
          properties:
            _seconds: { type: integer, format: int64 }
            _nanoseconds: { type: integer }
        updatedAt:
          type: object
          properties:
            _seconds: { type: integer, format: int64 }
            _nanoseconds: { type: integer }
    RoomMember:
      type: object
      properties:
        roomId: { type: string }
        uid: { type: string }
        joinedAt:
          type: object
          nullable: true
          properties:
            _seconds: { type: integer, format: int64 }
            _nanoseconds: { type: integer }
    Message:
      type: object
      properties:
        id: { type: string }
        roomId: { type: string }
        autorId: { type: string }
        autorNombre: { type: string }
        texto: { type: string }
        createdAt: { type: string, format: date-time }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            field: { type: string }
            fields:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }