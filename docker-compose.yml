services:
  backend-api:
    build:
      context: ./backend-api
    container_name: backend-api
    env_file:
      - ./backend-api/.env
    ports:
      - "3001:3001"
    restart: unless-stopped

  backend-realtime:
    build:
      context: ./backend-realtime
    container_name: backend-realtime
    environment:
      PORT: 3002
    ports:
      - "3002:3002"
    restart: unless-stopped
